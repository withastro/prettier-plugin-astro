name: Congratsbot

on:
  push:
    branches: [main]

permissions: {}

jobs:
  congrats:
    name: congratsbot
    if: ${{ github.repository_owner == 'withastro' && github.event.head_commit.message != '[ci] format' }}
    uses: withastro/automation/.github/workflows/congratsbot.yml@39c495d03416085561ee8b93a4f8ecdf94290bb8 # main
    with:
      EMOJIS: '💐,🌼,🌻,🌹,🌺,🪷,🌷,🏵️'
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CONGRATS }}
