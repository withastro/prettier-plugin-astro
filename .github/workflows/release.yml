name: Changelog

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Changelog
    if: github.repository_owner == 'withastro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm trusted publishing
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits

      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Check whether this push versioned the package
        id: versioned
        run: |
          previous=$(git show HEAD^:package.json | jq -r .version)
          current=$(jq -r .version package.json)
          echo "Previous version: $previous — current version: $current"
          if [ "$previous" = "$current" ]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          # Changesets otherwise publishes package.json's current version on any changeset-less push
          publish: ${{ steps.versioned.outputs.result == 'true' && 'pnpm release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: '' # Empty so the action leaves npm auth to trusted publishing

      - name: push main branch to latest branch
        if: steps.changesets.outputs.published == 'true'
        id: git-push-latest
        # Note: this will fail if "latest" and "main" have different commit history,
        # which is a good thing! Also, don't push if in pre-release mode.
        run: '(test -f .changeset/pre.json && echo "prerelease: skip pushing to latest branch.") || git push origin main:latest'
